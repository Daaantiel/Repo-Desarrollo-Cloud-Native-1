# ==========================================
# MS-ORDERS - AWS + POSTGRESQL + RABBITMQ
# ==========================================

server:
  port: 8087
  address: 0.0.0.0

spring:
  application:
    name: ms-orders

  # Base de datos PostgreSQL en Amazon RDS
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME:pokemarket360}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Persistencia JPA
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # Configuracion original de RabbitMQ
  rabbitmq:
    host: 172.31.28.107
    port: 5673
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

messaging:
  exchange: cmd.direct

  routing:
    email: email.send
    stock: stock.reserve
    invoice: invoice.gen

# Inventario en el microservicio de catalogo
inventory:
  base-url: http://172.31.30.211:8083
